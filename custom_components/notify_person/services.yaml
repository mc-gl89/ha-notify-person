add_group:
  name: Add Notification Group
  description: Create or update a notification group.
  fields:
    group:
      name: Group Name
      description: The name of the group.
      required: true
      selector:
        text:
    persons:
      name: Persons
      description: List of person names to include in the group.
      required: true
      selector:
        object:

remove_group:
  name: Remove Notification Group
  description: Remove a notification group.
  fields:
    group:
      name: Group Name
      description: The name of the group to remove.
      required: true
      selector:
        text:

update_person_defaults:
  name: Update Person Defaults
  description: Update default notification settings for a person.
  fields:
    person:
      name: Person
      description: The person to update.
      required: true
      selector:
        text:
    channel:
      name: Default Channel
      description: Default notification channel.
      required: false
      selector:
        text:
    criticality:
      name: Default Criticality
      description: Default criticality level.
      required: false
      selector:
        select:
          options:
            - normal
            - high
            - critical
    importance:
      name: Default Importance
      description: Default importance level.
      required: false
      selector:
        select:
          options:
            - default
            - low
            - high
