simple_notify:
  name: Simple Notify
  description: Sende eine einfache Benachrichtigung an eine oder mehrere Personen. Nur konfigurierte Personen erhalten Benachrichtigungen.
  fields:
    person:
      name: Personen
      description: Eine oder mehrere Home Assistant Personen (nur konfigurierte erhalten Benachrichtigungen).
      required: true
      selector:
        entity:
          domain: person
          multiple: true
    message:
      name: Nachricht
      description: Inhalt der Benachrichtigung.
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      description: Titel der Benachrichtigung (optional).
      required: false
      default: ""
      selector:
        text:
    actions:
      name: Buttons
      description: Interaktive Buttons für die Benachrichtigung.
      required: false
      selector:
        list:
          type: object
          object:
            action:
              name: Button ID
              description: Action ID (z.B. 'open_door')
              selector:
                text:
            title:
              name: Button Titel
              description: Angezeigter Text (z.B. 'Tür öffnen')
              selector:
                text:

advanced_notify:
  name: Advanced Notify
  description: Erweiterte Benachrichtigung mit allen Optionen. Nur konfigurierte Personen erhalten Benachrichtigungen.
  fields:
    person:
      name: Personen
      description: Eine oder mehrere Home Assistant Personen (nur konfigurierte erhalten Benachrichtigungen).
      required: true
      selector:
        entity:
          domain: person
          multiple: true
    message:
      name: Nachricht
      description: Inhalt der Benachrichtigung.
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      description: Titel der Benachrichtigung (optional).
      required: false
      default: ""
      selector:
        text:
    channel:
      name: Kanal
      description: Android Benachrichtigungskanal (wird automatisch erstellt).
      required: false
      example: "Wartung"
      selector:
        text:
    priority:
      name: Priorität
      description: Priorität der Benachrichtigung.
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "normal"
            - "high"
            - "low"
    critical:
      name: Kritisch
      description: Kritische Benachrichtigung (bypass DND auf iOS, High Priority auf Android).
      required: false
      default: false
      selector:
        boolean:
    tag:
      name: Tag
      description: Tag für Benachrichtigungsersetzung oder -entfernung.
      required: false
      example: "bewaesserung"
      selector:
        text:
    persistent:
      name: Persistent
      description: Bleibt im Notification Center bis explizit entfernt.
      required: false
      default: false
      selector:
        boolean:
    color:
      name: Farbe
      description: LED-Farbe der Benachrichtigung (nur Android).
      required: false
      selector:
        select:
          options:
            - "red"
            - "orange"
            - "yellow"
            - "green"
            - "blue"
            - "indigo"
            - "violet"
            - "white"
            - "black"
    actions:
      name: Buttons
      description: Interaktive Buttons für die Benachrichtigung.
      required: false
      selector:
        list:
          type: object
          object:
            action:
              name: Button ID
              description: Action ID (z.B. 'open_door')
              selector:
                text:
            title:
              name: Button Titel
              description: Angezeigter Text (z.B. 'Tür öffnen')
              selector:
                text:
    data:
      name: Zusätzliche Daten
      description: Beliebige zusätzliche Daten für die mobile App.
      required: false
      selector:
        object:

# Hinweis: Person-spezifische Services (z.B. notify_person.notify_marco)
# werden dynamisch bei Setup registriert und erscheinen automatisch
# unter Entwicklerwerkzeuge → Services nach Einrichtung eines Config Entries.
