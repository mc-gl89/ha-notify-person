simple_notify:
  name: Simple Notify
  description: Sende eine einfache Benachrichtigung an eine oder mehrere Personen oder Gruppen.
  fields:
    person:
      name: Personen / Gruppen
      description: Eine oder mehrere Personen oder Gruppen aus der Notify Person Konfiguration.
      required: true
      selector:
        select:
          multiple: true
          options: []
    message:
      name: Nachricht
      description: Inhalt der Benachrichtigung.
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      description: Titel der Benachrichtigung.
      required: false
      default: "Home Assistant"
      selector:
        text:

advanced_notify:
  name: Advanced Notify
  description: Erweiterte Benachrichtigung mit allen Optionen (Kanal, Priorität, Aktionen, etc.) an eine oder mehrere Personen.
  fields:
    person:
      name: Personen / Gruppen
      description: Eine oder mehrere Personen oder Gruppen aus der Notify Person Konfiguration.
      required: true
      selector:
        select:
          multiple: true
          options: []
    message:
      name: Nachricht
      description: Inhalt der Benachrichtigung.
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      description: Titel der Benachrichtigung.
      required: false
      default: "Home Assistant"
      selector:
        text:
    channel:
      name: Kanal
      description: Android Benachrichtigungskanal (wird automatisch erstellt).
      required: false
      example: "Wartung"
      selector:
        text:
    priority:
      name: Priorität
      description: Priorität der Benachrichtigung.
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "normal"
            - "high"
            - "low"
    critical:
      name: Kritisch
      description: Kritische Benachrichtigung (bypass DND auf iOS, High Priority auf Android).
      required: false
      default: false
      selector:
        boolean:
    tag:
      name: Tag
      description: Tag für Benachrichtigungsersetzung oder -entfernung.
      required: false
      example: "bewaesserung"
      selector:
        text:
    persistent:
      name: Persistent
      description: Bleibt im Notification Center bis explizit entfernt.
      required: false
      default: false
      selector:
        boolean:
    actions:
      name: Aktionen
      description: Interaktive Buttons (Action ID und Title pro Button).
      required: false
      selector:
        object:
    data:
      name: Zusätzliche Daten
      description: Beliebige zusätzliche Daten für die mobile App.
      required: false
      selector:
        object:

# Hinweis: Person-spezifische Services (z.B. notify_person.notify_marco)
# werden dynamisch bei Setup registriert und erscheinen automatisch
# unter Entwicklerwerkzeuge → Services nach Einrichtung eines Config Entries.
