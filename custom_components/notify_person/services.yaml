# Services for Notify Person integration

# Native notify services are automatically created:
# notify.person_xxx — for each configured person
# notify.group_xxx  — for each configured group

# Use these to manage configuration at runtime:

add_group:
  name: Add Notification Group
  description: Create or update a notification group.
  fields:
    group:
      name: Group Name
      description: The name of the group.
      required: true
      selector:
        text:
    persons:
      name: Persons
      description: List of person names to include.
      required: true
      selector:
        object:

remove_group:
  name: Remove Notification Group
  description: Remove a notification group.
  fields:
    group:
      name: Group Name
      description: The name of the group to remove.
      required: true
      selector:
        text:

update_person:
  name: Update Person Devices
  description: Update notification devices for a person.
  fields:
    person:
      name: Person
      description: The person to update.
      required: true
      selector:
        text:
    devices:
      name: Devices
      description: New list of notify services.
      required: true
      selector:
        object:

reload:
  name: Reload
  description: Reload Notify Person configuration.
