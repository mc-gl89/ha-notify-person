simple_notify:
  name: Simple Notify
  description: Sende eine einfache Benachrichtigung an eine oder mehrere Personen. Nur konfigurierte Personen erhalten Benachrichtigungen.
  fields:
    person:
      name: Personen
      description: Eine oder mehrere Home Assistant Personen (nur konfigurierte erhalten Benachrichtigungen).
      required: true
      selector:
        entity:
          domain: person
          multiple: true
    message:
      name: Nachricht
      description: Inhalt der Benachrichtigung.
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      description: Titel der Benachrichtigung.
      required: false
      default: "Home Assistant"
      selector:
        text:

advanced_notify:
  name: Advanced Notify
  description: Erweiterte Benachrichtigung mit allen Optionen. Nur konfigurierte Personen erhalten Benachrichtigungen.
  fields:
    person:
      name: Personen
      description: Eine oder mehrere Home Assistant Personen (nur konfigurierte erhalten Benachrichtigungen).
      required: true
      selector:
        entity:
          domain: person
          multiple: true
    message:
      name: Nachricht
      description: Inhalt der Benachrichtigung.
      required: true
      selector:
        text:
          multiline: true
    title:
      name: Titel
      description: Titel der Benachrichtigung.
      required: false
      default: "Home Assistant"
      selector:
        text:
    channel:
      name: Kanal
      description: Android Benachrichtigungskanal (wird automatisch erstellt).
      required: false
      example: "Wartung"
      selector:
        text:
    priority:
      name: Priorität
      description: Priorität der Benachrichtigung.
      required: false
      default: "normal"
      selector:
        select:
          options:
            - "normal"
            - "high"
            - "low"
    critical:
      name: Kritisch
      description: Kritische Benachrichtigung (bypass DND auf iOS, High Priority auf Android).
      required: false
      default: false
      selector:
        boolean:
    tag:
      name: Tag
      description: Tag für Benachrichtigungsersetzung oder -entfernung.
      required: false
      example: "bewaesserung"
      selector:
        text:
    persistent:
      name: Persistent
      description: Bleibt im Notification Center bis explizit entfernt.
      required: false
      default: false
      selector:
        boolean:
    actions:
      name: Aktionen (YAML)
      description: Interaktive Buttons als YAML-Liste (legacy). Nutze stattdessen die Button-Felder unten für die UI.
      required: false
      selector:
        object:
    action_1_id:
      name: Button 1 ID
      description: Action ID für Button 1 (z.B. 'open_door').
      required: false
      selector:
        text:
    action_1_title:
      name: Button 1 Titel
      description: Angezeigter Text für Button 1 (z.B. 'Tür öffnen').
      required: false
      selector:
        text:
    action_2_id:
      name: Button 2 ID
      description: Action ID für Button 2.
      required: false
      selector:
        text:
    action_2_title:
      name: Button 2 Titel
      description: Angezeigter Text für Button 2.
      required: false
      selector:
        text:
    action_3_id:
      name: Button 3 ID
      description: Action ID für Button 3.
      required: false
      selector:
        text:
    action_3_title:
      name: Button 3 Titel
      description: Angezeigter Text für Button 3.
      required: false
      selector:
        text:
    action_4_id:
      name: Button 4 ID
      description: Action ID für Button 4.
      required: false
      selector:
        text:
    action_4_title:
      name: Button 4 Titel
      description: Angezeigter Text für Button 4.
      required: false
      selector:
        text:
    action_5_id:
      name: Button 5 ID
      description: Action ID für Button 5.
      required: false
      selector:
        text:
    action_5_title:
      name: Button 5 Titel
      description: Angezeigter Text für Button 5.
      required: false
      selector:
        text:
    data:
      name: Zusätzliche Daten
      description: Beliebige zusätzliche Daten für die mobile App.
      required: false
      selector:
        object:

# Hinweis: Person-spezifische Services (z.B. notify_person.notify_marco)
# werden dynamisch bei Setup registriert und erscheinen automatisch
# unter Entwicklerwerkzeuge → Services nach Einrichtung eines Config Entries.
