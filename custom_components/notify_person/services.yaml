# Services for Notify Person integration

notify_person:
  name: Notify Person
  description: Send a notification to a specific person by name.
  fields:
    person:
      name: Person
      description: The person to notify (name or entity_id).
      required: true
      example: "John Doe"
      selector:
        text:
    message:
      name: Message
      description: The message to send.
      required: true
      example: "Your package arrived!"
      selector:
        text:
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Home Assistant"
      selector:
        text:
    data:
      name: Data
      description: Extra data for the notification.
      required: false
      selector:
        object:
    channel:
      name: Channel
      description: Notification channel override.
      required: false
      example: "alarms"
      selector:
        text:
    criticality:
      name: Criticality
      description: Override default criticality.
      required: false
      selector:
        select:
          options:
            - normal
            - high
            - critical
    importance:
      name: Importance
      description: Override default importance.
      required: false
      selector:
        select:
          options:
            - default
            - low
            - high

notify_group:
  name: Notify Group
  description: Send a notification to a group of persons.
  fields:
    group:
      name: Group
      description: The notification group to send to.
      required: true
      example: "family"
      selector:
        text:
    message:
      name: Message
      description: The message to send.
      required: true
      example: "Dinner is ready!"
      selector:
        text:
    title:
      name: Title
      description: Optional title for the notification.
      required: false
      example: "Home Assistant"
      selector:
        text:
    data:
      name: Data
      description: Extra data for the notification.
      required: false
      selector:
        object:
    channel:
      name: Channel
      description: Notification channel override.
      required: false
      example: "alarms"
      selector:
        text:
    criticality:
      name: Criticality
      description: Override default criticality.
      required: false
      selector:
        select:
